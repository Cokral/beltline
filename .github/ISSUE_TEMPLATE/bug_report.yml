name: Bug report
description: Something in Beltline doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problems go through private reporting, not issues: see SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The smallest steps that show it, in `beltlined --demo` if you can.
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `beltlined --version`.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 26.1, Apple silicon
  - type: input
    id: runner
    attributes:
      label: Agent runner and its version
      placeholder: Claude Code 2.1.0
  - type: textarea
    id: log
    attributes:
      label: beltlined.log
      description: The lines around the problem, from `~/Library/Application Support/Beltline/beltlined.log`.
      render: text
