name: Feature request
description: Something Beltline could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How Beltline could help. Sketches welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead now
